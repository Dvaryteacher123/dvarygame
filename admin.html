<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVARY Games - Admin Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 440px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
        }
        .logo { text-align: center; margin-bottom: 35px; }
        .logo h1 { color: #fff; font-size: 32px; font-weight: 800; letter-spacing: -1px; }
        .logo span { color: #e94560; }
        .logo p { color: rgba(255,255,255,0.5); font-size: 14px; margin-top: 5px; }
        .lock-icon { font-size: 56px; color: #e94560; margin-bottom: 15px; display: block; }
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; color: rgba(255,255,255,0.8); font-size: 13px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: #e94560;
            background: rgba(255,255,255,0.12);
            box-shadow: 0 0 30px rgba(233,69,96,0.15);
        }
        .form-group input::placeholder { color: rgba(255,255,255,0.3); }
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #e94560, #c23152);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .btn-login:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(233,69,96,0.4); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .error {
            background: rgba(233,69,96,0.2);
            color: #e94560;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 18px;
            display: none;
            border: 1px solid rgba(233,69,96,0.2);
        }
        .error.show { display: block; }
        .footer { text-align: center; margin-top: 25px; color: rgba(255,255,255,0.25); font-size: 13px; }
        .footer a { color: rgba(255,255,255,0.4); text-decoration: none; transition: 0.3s; }
        .footer a:hover { color: #e94560; }
        .spinner {
            display: inline-block;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 480px) { .login-container { padding: 30px 20px; } .logo h1 { font-size: 26px; } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <span class="lock-icon">🔐</span>
            <h1>DVARY <span>Games</span></h1>
            <p>Administrator Login</p>
        </div>
        <div class="error" id="errorMsg"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>📧 Email Address</label>
                <input type="email" id="email" placeholder="admin@dvarygames.com" required>
            </div>
            <div class="form-group">
                <label>🔑 Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                <span id="btnText">Login to Admin Panel</span>
            </button>
        </form>
        <div class="footer">
            <a href="/">← Back to Home</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById('loginForm');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const btn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailVal = email.value.trim();
            const passVal = password.value.trim();

            if (!emailVal || !passVal) {
                showError('Please fill in all fields');
                return;
            }

            setLoading(true);

            try {
                const userCredential = await signInWithEmailAndPassword(auth, emailVal, passVal);
                const user = userCredential.user;
                const idTokenResult = await user.getIdTokenResult();
                
                if (!idTokenResult.claims.admin) {
                    showError('Access denied. Admin privileges required.');
                    await auth.signOut();
                    setLoading(false);
                    return;
                }

                window.location.href = '/admin';
            } catch (error) {
                let msg = 'Login failed. Please try again.';
                if (error.code === 'auth/user-not-found') msg = 'Admin account not found.';
                else if (error.code === 'auth/wrong-password') msg = 'Incorrect password.';
                else if (error.code === 'auth/invalid-email') msg = 'Invalid email format.';
                else if (error.code === 'auth/too-many-requests') msg = 'Too many attempts. Try again later.';
                showError(msg);
                setLoading(false);
            }
        });

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('show');
            clearTimeout(window.errorTimeout);
            window.errorTimeout = setTimeout(() => errorMsg.classList.remove('show'), 5000);
        }

        function setLoading(isLoading) {
            if (isLoading) {
                btn.disabled = true;
                btnText.innerHTML = '<span class="spinner"></span> Verifying...';
            } else {
                btn.disabled = false;
                btnText.textContent = 'Login to Admin Panel';
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const idTokenResult = await user.getIdTokenResult();
                    if (idTokenResult.claims.admin) {
                        window.location.href = '/admin';
                    } else {
                        await auth.signOut();
                    }
                } catch (error) {
                    console.error('Auth check error:', error);
                }
            }
        });
    </script>
</body>
</html>
